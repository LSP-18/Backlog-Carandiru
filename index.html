<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopee Backlog Dashboard</title>

<!-- Roboto Font -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    font-family: 'Roboto', system-ui, sans-serif;
    background: #f5f5f5;
    margin: 0;
}

/* HERO */
.hero {
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
    url('https://d2xsxph8kpxj0f.cloudfront.net/310519663514818300/fMYrqd5MnqsWGGbxqvbH5H/shopee-hero-background-jRfevcA3fhWgELH8QXsgUT.webp');
    background-size: cover;
    background-position: center;
    padding: 40px 0;
}

.hero-box {
    backdrop-filter: blur(10px);
    background: rgba(0,0,0,0.35);
    padding: 20px 30px;
    border-radius: 12px;
    color: white;
    display: inline-block;
}

/* CARDS */
.card {
    background: white;
    border-radius: 12px;
    padding: 24px;
    border: 1px solid #e8e8e8;
    box-shadow: 0 6px 18px rgba(0,0,0,0.05);
    transition: transform 0.25s, box-shadow 0.25s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 28px rgba(0,0,0,0.08);
}

/* STATS */
.stat {
    position: relative;
    overflow: hidden;
}

.stat::after {
    content: '';
    position: absolute;
    right: -20px;
    top: -20px;
    width: 80px;
    height: 80px;
    background: rgba(238,77,45,0.1);
    border-radius: 50%;
}

/* PROGRESS */
.progress {
    height: 8px;
    background: #eee;
    border-radius: 5px;
    overflow: hidden;
}

.fill {
    height: 100%;
    border-radius: 5px;
    box-shadow: 0 0 10px rgba(238,77,45,0.4);
    transition: width 1s ease-out;
}

/* TOTAL CARD */
.total {
    background: linear-gradient(135deg, #ee4d2d, #ff784e);
    color: white;
    text-align: center;
    padding: 40px;
    border-radius: 16px;
    position: relative;
}

.total::after {
    content: '';
    position: absolute;
    width: 200px;
    height: 200px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    top: -60px;
    right: -60px;
}

.big {
    font-size: 64px;
    font-weight: 900;
}

/* ANIMATIONS */
.fade {
    animation: fade .5s ease;
}

@keyframes fade {
    from {opacity:0}
    to {opacity:1}
}
</style>
</head>
<body>

<div id="root"></div>

<script>
const data = {
    total: 8618,
    stats: [
        {label:'Total da Semana', value:8618},
        {label:'Maior Volume', value:'OFFICE'},
        {label:'Status', value:'Crítico', color:'#ff4d4f'}
    ],
    categories: [
        {name:'Amarelo', value:640, color:'#f5c518'},
        {name:'Erro', value:1200, color:'#ee4d2d'},
        {name:'On Hold', value:2951, color:'#0055aa'},
        {name:'Fleet', value:817, color:'#26aa99'},
        {name:'OFFICE', value:3010, color:'#757575'}
    ]
};

function animate(el, end){
    let start=0;
    let duration=1200;
    let startTime=null;

    function step(t){
        if(!startTime) startTime=t;
        let progress=Math.min((t-startTime)/duration,1);
        el.innerText=Math.floor(progress*end).toLocaleString();
        if(progress<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}

function render(){
    const root=document.getElementById('root');

    root.innerHTML=`
    <div class="hero">
        <div style="max-width:1200px;margin:auto;padding:0 20px;">
            <div class="hero-box">
                <h1 style="font-size:24px;font-weight:700;">📦 Backlog Carandiru</h1>
                <p style="font-size:14px;opacity:.9;">Shopee Brasil • Dashboard Semanal</p>
            </div>
        </div>
    </div>

    <div style="max-width:1200px;margin:auto;padding:20px;">

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;">
            ${data.stats.map(s=>`
                <div class="card stat fade">
                    <div style="font-size:14px;color:#777">${s.label}</div>
                    <div style="font-size:28px;font-weight:700;color:${s.color||'#ee4d2d'}">${s.value}</div>
                </div>
            `).join('')}
        </div>

        <div class="card" style="margin-top:20px;">
            <h3 style="margin-bottom:15px;">Volume por Categoria</h3>

            ${data.categories.map(c=>`
                <div style="margin-bottom:15px;">
                    <div style="display:flex;justify-content:space-between;font-size:13px;">
                        <span>${c.name}</span>
                        <span>${c.value.toLocaleString()}</span>
                    </div>
                    <div class="progress">
                        <div class="fill" style="width:0;background:${c.color}"></div>
                    </div>
                </div>
            `).join('')}
        </div>

        <div class="total" style="margin-top:20px;">
            <div>Total de Backlog</div>
            <div class="big" id="total"></div>
        </div>

    </div>
    `;

    animate(document.getElementById('total'), data.total);

    const fills=document.querySelectorAll('.fill');
    const totalVal=data.categories.reduce((a,b)=>a+b.value,0);
    fills.forEach((f,i)=>{
        let perc=(data.categories[i].value/totalVal)*100;
        setTimeout(()=>{f.style.width=perc+'%'},200);
    });
}

render();
</script>

</body>
</html>
