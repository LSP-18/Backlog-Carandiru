
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhamento de Backlog - Shopee Logistics</title>
    <link rel="icon" href="https://cdn.awsli.com.br/800x800/2015/2015798/produto/354645871/shoppe--2--mvj1hgvttt.png">
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --shopee-orange: #EE4D2D;
            --shopee-orange-hover: #D73211;
            --shopee-bg: #F6F6F6;
            --shopee-white: #FFFFFF;
            --shopee-text-main: #222222;
            --shopee-text-muted: #757575;
            --shopee-border: #E8E8E8;
            --shopee-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            --radius: 12px;
            
            /* Category Colors */
            --color-amarelo: #F5C518;
            --color-erro: #EE4D2D;
            --color-onhold: #0055AA;
            --color-fleet: #26AA99;
            --color-office: #64748B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--shopee-bg);
            color: var(--shopee-text-main);
            line-height: 1.6;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- HEADER --- */
        header {
            background: var(--shopee-white);
            padding: 24px 32px;
            border-radius: var(--radius);
            box-shadow: var(--shopee-shadow);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--shopee-orange);
        }

        .header-info h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--shopee-orange);
            letter-spacing: -0.5px;
        }

        .header-info p {
            font-size: 14px;
            color: var(--shopee-text-muted);
            font-weight: 500;
        }

        .shopee-logo {
            height: 32px;
        }

        /* --- WEEK SECTION --- */
        .week-section {
            margin-bottom: 40px;
        }

        .week-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 8px;
        }

        .week-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--shopee-text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .week-total {
            background: var(--shopee-orange);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
        }

        /* --- TABLE CARD --- */
        .card {
            background: var(--shopee-white);
            border-radius: var(--radius);
            box-shadow: var(--shopee-shadow);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #FAFAFA;
            padding: 16px 20px;
            font-size: 11px;
            font-weight: 700;
            color: var(--shopee-text-muted);
            text-transform: uppercase;
            border-bottom: 1px solid var(--shopee-border);
        }

        td {
            padding: 14px 20px;
            font-size: 13px;
            border-bottom: 1px solid var(--shopee-border);
        }

        .td-data { font-weight: 700; color: var(--shopee-text-main); }
        .td-total { font-weight: 800; color: var(--shopee-orange); background: #FFF5F1; }
        
        .val-zero { color: #D1D1D1; }

        /* --- CHARTS --- */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 16px;
        }

        .chart-container {
            height: 250px;
            padding: 16px;
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--shopee-text-muted);
            font-size: 12px;
        }

        @media (max-width: 992px) {
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-info">
            <h1>Relatório de Backlog Detalhado</h1>
            <p>Visão Diária por Categoria • Shopee Logistics</p>
        </div>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Shopee_logo.svg/1200px-Shopee_logo.svg.png" alt="Shopee" class="shopee-logo">
    </header>

    <div id="content">
        <!-- JS Populated -->
    </div>

    <footer>
        © 2026 Shopee Logistics • Gestão de Backlog • Carandiru
    </footer>
</div>

<script>
    const data = [
      {
        "semana": "30/03 - 05/04",
        "total": 12894,
        "detalhe_diario": [
          { "data": "30/03", "dia_semana": "Segunda", "amarelo": 149, "erro": 233, "onhold": 502, "fleet": 272, "office": 0, "total": 1156 },
          { "data": "31/03", "dia_semana": "Terça", "amarelo": 51, "erro": 178, "onhold": 252, "fleet": 109, "office": 0, "total": 590 },
          { "data": "01/04", "dia_semana": "Quarta", "amarelo": 149, "erro": 230, "onhold": 61, "fleet": 87, "office": 0, "total": 527 },
          { "data": "02/04", "dia_semana": "Quinta", "amarelo": 82, "erro": 198, "onhold": 37, "fleet": 162, "office": 0, "total": 479 },
          { "data": "03/04", "dia_semana": "Sexta", "amarelo": 209, "erro": 361, "onhold": 2099, "fleet": 187, "office": 3010, "total": 5866 },
          { "data": "04/04", "dia_semana": "Sábado", "amarelo": 177, "erro": 147, "onhold": 45, "fleet": 65, "office": 2484, "total": 2918 },
          { "data": "05/04", "dia_semana": "Domingo", "amarelo": 57, "erro": 165, "onhold": 29, "fleet": 120, "office": 987, "total": 1358 }
        ]
      },
      {
        "semana": "06/04 - 12/04",
        "total": 1103,
        "detalhe_diario": [
          { "data": "06/04", "dia_semana": "Segunda", "amarelo": 503, "erro": 0, "onhold": 168, "fleet": 0, "office": 0, "total": 671 },
          { "data": "07/04", "dia_semana": "Terça", "amarelo": 157, "erro": 162, "onhold": 104, "fleet": 9, "office": 0, "total": 432 },
          { "data": "08/04", "dia_semana": "Quarta", "amarelo": 0, "erro": 0, "onhold": 0, "fleet": 0, "office": 0, "total": 0 },
          { "data": "09/04", "dia_semana": "Quinta", "amarelo": 0, "erro": 0, "onhold": 0, "fleet": 0, "office": 0, "total": 0 },
          { "data": "10/04", "dia_semana": "Sexta", "amarelo": 0, "erro": 0, "onhold": 0, "fleet": 0, "office": 0, "total": 0 },
          { "data": "11/04", "dia_semana": "Sábado", "amarelo": 0, "erro": 0, "onhold": 0, "fleet": 0, "office": 0, "total": 0 },
          { "data": "12/04", "dia_semana": "Domingo", "amarelo": 0, "erro": 0, "onhold": 0, "fleet": 0, "office": 0, "total": 0 }
        ]
      }
    ];

    function formatVal(v) {
        return v === 0 ? '<span class="val-zero">-</span>' : v.toLocaleString();
    }

    const container = document.getElementById('content');

    data.forEach((week, idx) => {
        const section = document.createElement('div');
        section.className = 'week-section';
        
        section.innerHTML = `
            <div class="week-header">
                <div class="week-title">
                    <i data-lucide="calendar" size="20" style="color: var(--shopee-orange)"></i>
                    Semana ${week.semana}
                </div>
                <div class="week-total">Total: ${week.total.toLocaleString()}</div>
            </div>
            <div class="card">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Dia</th>
                                <th>Data</th>
                                <th>Amarelo</th>
                                <th>Erro Operacional</th>
                                <th>On Hold</th>
                                <th>Retirada Fleet</th>
                                <th>Office</th>
                                <th>Total Dia</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${week.detalhe_diario.map(d => `
                                <tr>
                                    <td class="td-data">${d.dia_semana}</td>
                                    <td>${d.data}</td>
                                    <td>${formatVal(d.amarelo)}</td>
                                    <td>${formatVal(d.erro)}</td>
                                    <td>${formatVal(d.onhold)}</td>
                                    <td>${formatVal(d.fleet)}</td>
                                    <td>${formatVal(d.office)}</td>
                                    <td class="td-total">${formatVal(d.total)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="charts-grid">
                <div class="card chart-container">
                    <canvas id="chart-line-${idx}"></canvas>
                </div>
                <div class="card chart-container">
                    <canvas id="chart-bar-${idx}"></canvas>
                </div>
            </div>
        `;
        
        container.appendChild(section);

        // Render Charts
        setTimeout(() => {
            const ctxLine = document.getElementById(`chart-line-${idx}`).getContext('2d');
            new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: week.detalhe_diario.map(d => d.data),
                    datasets: [{
                        label: 'Total Diário',
                        data: week.detalhe_diario.map(d => d.total),
                        borderColor: '#EE4D2D',
                        backgroundColor: 'rgba(238, 77, 45, 0.1)',
                        fill: true, tension: 0.4, pointRadius: 4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            const ctxBar = document.getElementById(`chart-bar-${idx}`).getContext('2d');
            new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: ['Amarelo', 'Erro', 'On Hold', 'Fleet', 'Office'],
                    datasets: [{
                        data: [
                            week.detalhe_diario.reduce((a, b) => a + b.amarelo, 0),
                            week.detalhe_diario.reduce((a, b) => a + b.erro, 0),
                            week.detalhe_diario.reduce((a, b) => a + b.onhold, 0),
                            week.detalhe_diario.reduce((a, b) => a + b.fleet, 0),
                            week.detalhe_diario.reduce((a, b) => a + b.office, 0)
                        ],
                        backgroundColor: ['#F5C518', '#EE4D2D', '#0055AA', '#26AA99', '#64748B']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }, 100);
    });

    lucide.createIcons();
</script>
</body>
</html>
