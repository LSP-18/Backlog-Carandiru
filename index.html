
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visão Diária de Backlog - Shopee Logistics</title>
    <link rel="icon" href="https://cdn.awsli.com.br/800x800/2015/2015798/produto/354645871/shoppe--2--mvj1hgvttt.png">
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --shopee-orange: #EE4D2D;
            --shopee-orange-hover: #D73211;
            --shopee-bg: #F6F6F6;
            --shopee-white: #FFFFFF;
            --shopee-text-main: #222222;
            --shopee-text-muted: #757575;
            --shopee-border: #E8E8E8;
            --shopee-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            --radius: 12px;
            
            /* Category Colors */
            --color-amarelo: #F5C518;
            --color-erro: #EE4D2D;
            --color-onhold: #0055AA;
            --color-fleet: #26AA99;
            --color-office: #64748B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--shopee-bg);
            color: var(--shopee-text-main);
            line-height: 1.6;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- HEADER --- */
        header {
            background: var(--shopee-white);
            padding: 24px 32px;
            border-radius: var(--radius);
            box-shadow: var(--shopee-shadow);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--shopee-orange);
        }

        .header-info h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--shopee-orange);
            letter-spacing: -0.5px;
        }

        .header-info p {
            font-size: 14px;
            color: var(--shopee-text-muted);
            font-weight: 500;
        }

        .shopee-logo {
            height: 32px;
        }

        /* --- DAILY CARDS GRID --- */
        .daily-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .day-card {
            background: var(--shopee-white);
            border-radius: var(--radius);
            box-shadow: var(--shopee-shadow);
            padding: 20px;
            border-top: 4px solid var(--shopee-border);
            transition: transform 0.2s ease;
        }

        .day-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        .day-card.has-data {
            border-top-color: var(--shopee-orange);
        }

        .day-card.empty {
            opacity: 0.6;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--shopee-border);
            padding-bottom: 10px;
        }

        .day-info .date {
            font-size: 18px;
            font-weight: 800;
            color: var(--shopee-text-main);
        }

        .day-info .weekday {
            font-size: 12px;
            font-weight: 600;
            color: var(--shopee-text-muted);
            text-transform: uppercase;
        }

        .day-total {
            text-align: right;
        }

        .day-total .label {
            font-size: 10px;
            font-weight: 700;
            color: var(--shopee-text-muted);
            display: block;
        }

        .day-total .value {
            font-size: 20px;
            font-weight: 800;
            color: var(--shopee-orange);
        }

        .category-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .cat-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--shopee-text-main);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .cat-value {
            font-weight: 700;
            font-family: monospace;
            font-size: 14px;
        }

        .val-zero { color: #D1D1D1; }

        /* --- TABLE SECTION --- */
        .section-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-left: 8px;
        }

        .card-table {
            background: var(--shopee-white);
            border-radius: var(--radius);
            box-shadow: var(--shopee-shadow);
            overflow: hidden;
            margin-bottom: 40px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #FAFAFA;
            padding: 16px 20px;
            font-size: 11px;
            font-weight: 700;
            color: var(--shopee-text-muted);
            text-transform: uppercase;
            border-bottom: 1px solid var(--shopee-border);
        }

        td {
            padding: 14px 20px;
            font-size: 13px;
            border-bottom: 1px solid var(--shopee-border);
        }

        tr:last-child td { border-bottom: none; }

        .td-date-col { font-weight: 700; color: var(--shopee-text-main); }
        .td-total-col { font-weight: 800; color: var(--shopee-orange); background: #FFF5F1; }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--shopee-text-muted);
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-info">
            <h1>Visão Diária de Backlog</h1>
            <p>Relatório Detalhado por Categoria • 30/03 a 12/04</p>
        </div>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Shopee_logo.svg/1200px-Shopee_logo.svg.png" alt="Shopee" class="shopee-logo">
    </header>

    <div class="section-title">
        <i data-lucide="layout-grid" size="20" style="color: var(--shopee-orange)"></i>
        Resumo Diário (Cards)
    </div>

    <div id="daily-cards" class="daily-grid">
        <!-- JS Populated -->
    </div>

    <div class="section-title">
        <i data-lucide="list" size="20" style="color: var(--shopee-orange)"></i>
        Tabela Detalhada (Histórico Diário)
    </div>

    <div class="card-table">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Dia</th>
                        <th>Amarelo</th>
                        <th>Erro Operacional</th>
                        <th>On Hold</th>
                        <th>Retirada Fleet</th>
                        <th>Office</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- JS Populated -->
                </tbody>
            </table>
        </div>
    </div>

    <footer>
        © 2026 Shopee Logistics • Gestão de Backlog • Carandiru
    </footer>
</div>

<script>
    const timeline = [
      { "data": "30/03", "dia": "Segunda", "amarelo": 149, "erro": 233, "onhold": 502, "fleet": 272, "office": 0, "total": 1156 },
      { "data": "31/03", "dia": "Terça", "amarelo": 51, "erro": 178, "onhold": 252, "fleet": 109, "office": 0, "total": 590 },
      { "data": "01/04", "dia": "Quarta", "amarelo": 149, "erro": 230, "onhold": 61, "fleet": 87, "office": 0, "total": 527 },
      { "data": "02/04", "dia": "Quinta", "amarelo": 82, "erro": 198, "onhold": 37, "fleet": 162, "office": 0, "total": 479 },
      { "data": "03/04", "dia": "Sexta", "amarelo": 209, "erro": 361, "onhold": 2099, "fleet": 187, "office": 3010, "total": 5866 },
      { "data": "04/04", "dia": "Sábado", "amarelo": 177, "erro": 147, "onhold": 45, "fleet": 65, "office": 2484, "total": 2918 },
      { "data": "05/04", "dia": "Domingo", "amarelo": 57, "erro": 165, "onhold": 29, "fleet": 120, "office": 987, "total": 1358 },
      { "data": "06/04", "dia": "Segunda", "amarelo": 503, "erro": 0, "onhold": 168, "fleet": 0, "office": 0, "total": 671 },
      { "data": "07/04", "dia": "Terça", "amarelo": 157, "erro": 162, "onhold": 104, "fleet": 9, "office": 0, "total": 432 },
      { "data": "08/04", "dia": "Quarta", "amarelo": 0, "erro": 0, "onhold": 0, "fleet": 0, "office": 0, "total": 0 },
      { "data": "09/04", "dia": "Quinta", "amarelo": 0, "erro": 0, "onhold": 0, "fleet": 0, "office": 0, "total": 0 },
      { "data": "10/04", "dia": "Sexta", "amarelo": 0, "erro": 0, "onhold": 0, "fleet": 0, "office": 0, "total": 0 },
      { "data": "11/04", "dia": "Sábado", "amarelo": 0, "erro": 0, "onhold": 0, "fleet": 0, "office": 0, "total": 0 },
      { "data": "12/04", "dia": "Domingo", "amarelo": 0, "erro": 0, "onhold": 0, "fleet": 0, "office": 0, "total": 0 }
    ];

    function formatVal(v) {
        return v === 0 ? '<span class="val-zero">-</span>' : v.toLocaleString();
    }

    const cardsContainer = document.getElementById('daily-cards');
    const tableBody = document.getElementById('table-body');

    timeline.forEach(day => {
        // Create Card
        const card = document.createElement('div');
        card.className = `day-card ${day.total > 0 ? 'has-data' : 'empty'}`;
        card.innerHTML = `
            <div class="day-header">
                <div class="day-info">
                    <div class="date">${day.data}</div>
                    <div class="weekday">${day.dia}</div>
                </div>
                <div class="day-total">
                    <span class="label">TOTAL</span>
                    <span class="value">${day.total.toLocaleString()}</span>
                </div>
            </div>
            <div class="category-list">
                <div class="category-item">
                    <div class="cat-label"><div class="dot" style="background:var(--color-amarelo)"></div> Amarelo</div>
                    <div class="cat-value">${formatVal(day.amarelo)}</div>
                </div>
                <div class="category-item">
                    <div class="cat-label"><div class="dot" style="background:var(--color-erro)"></div> Erro Op.</div>
                    <div class="cat-value">${formatVal(day.erro)}</div>
                </div>
                <div class="category-item">
                    <div class="cat-label"><div class="dot" style="background:var(--color-onhold)"></div> On Hold</div>
                    <div class="cat-value">${formatVal(day.onhold)}</div>
                </div>
                <div class="category-item">
                    <div class="cat-label"><div class="dot" style="background:var(--color-fleet)"></div> Ret. Fleet</div>
                    <div class="cat-value">${formatVal(day.fleet)}</div>
                </div>
                <div class="category-item">
                    <div class="cat-label"><div class="dot" style="background:var(--color-office)"></div> Office</div>
                    <div class="cat-value">${formatVal(day.office)}</div>
                </div>
            </div>
        `;
        cardsContainer.appendChild(card);

        // Add Table Row
        const row = `
            <tr>
                <td class="td-date-col">${day.data}</td>
                <td>${day.dia}</td>
                <td>${formatVal(day.amarelo)}</td>
                <td>${formatVal(day.erro)}</td>
                <td>${formatVal(day.onhold)}</td>
                <td>${formatVal(day.fleet)}</td>
                <td>${formatVal(day.office)}</td>
                <td class="td-total-col">${day.total.toLocaleString()}</td>
            </tr>
        `;
        tableBody.innerHTML += row;
    });

    lucide.createIcons();
</script>
</body>
</html>
