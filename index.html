<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopee Backlog Dashboard</title>
    
    <!-- Roboto Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222222;
        }

        /* ── SHOPEE BRAND COLORS ── */
        :root {
            --shopee-orange: #ee4d2d;
            --shopee-orange-light: #ff5722;
            --shopee-blue: #0055aa;
            --shopee-green: #26aa99;
            --shopee-yellow: #f5c518;
            --shopee-gray: #757575;
            --shopee-bg: #f5f5f5;
            --shopee-white: #ffffff;
            --shopee-text: #222222;
            --shopee-text-light: #757575;
            --shopee-border: #e8e8e8;
            --shopee-hover: #fafafa;
            --shopee-badge-bg: #fff5f1;
            --shopee-badge-border: #ffdbcc;
        }

        /* ── SHOPEE DASHBOARD COMPONENTS ── */
        .shopee-card {
            background: var(--shopee-white);
            color: var(--shopee-text);
            border-radius: 4px;
            padding: 24px;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--shopee-border);
            margin-bottom: 20px;
        }

        .shopee-stat-box {
            background: var(--shopee-white);
            color: var(--shopee-text);
            border-radius: 4px;
            padding: 20px;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--shopee-border);
            border-top: 3px solid var(--shopee-orange);
        }

        .shopee-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            background: var(--shopee-badge-bg);
            color: var(--shopee-orange);
            border: 1px solid var(--shopee-badge-border);
        }

        .shopee-progress-bar {
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
        }

        .shopee-progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 1s ease-out;
        }

        .shopee-table-row-hover:hover {
            background: var(--shopee-hover);
            transition: background-color 150ms;
        }

        .shopee-gradient-orange {
            background: linear-gradient(135deg, var(--shopee-orange) 0%, var(--shopee-orange-light) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .hero-section {
            background-image: url('https://d2xsxph8kpxj0f.cloudfront.net/310519663514818300/fMYrqd5MnqsWGGbxqvbH5H/shopee-hero-background-jRfevcA3fhWgELH8QXsgUT.webp');
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            padding: 32px 0;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
        }

        .hero-content {
            position: relative;
            z-index: 10;
        }

        .hero-content h1 {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .hero-content h1 img {
            height: 40px;
        }

        .hero-content h1 span {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }

        .hero-content p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--shopee-orange);
            margin-top: 10px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--shopee-text-light);
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: #fafafa;
            text-align: left;
            padding: 12px 16px;
            color: var(--shopee-text-light);
            font-weight: 500;
            border-bottom: 1px solid var(--shopee-border);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--shopee-border);
        }

        .category-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .total-row {
            background: #fff5f1;
            font-weight: 700;
            color: var(--shopee-orange);
        }

        .bottom-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .progress-item {
            margin-bottom: 15px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .big-total-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            border-radius: 4px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
        }

        .big-total-val {
            font-size: 72px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .big-total-label {
            font-size: 16px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .shopee-footer {
            text-align: center;
            padding: 30px;
            color: var(--shopee-text-light);
            font-size: 12px;
            border-top: 1px solid var(--shopee-border);
            margin-top: 20px;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .slide-up {
            animation: slideUp 0.5s ease-out forwards;
        }

        .scale-in {
            animation: scaleIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 1024px) {
            .bottom-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px 12px;
            }

            .big-total-val {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // ── DADOS DO DASHBOARD ── 
        const dashboardData = {
            stats: [
                { label: 'Total da Semana', value: '8.618' },
                { label: 'Maior Volume', value: 'OFFICE' },
                { label: 'Status', value: 'Ruim', color: '#26aa99' },
            ],
            categories: [
                { name: 'Amarelo', color: '#f5c518', value: 640, percentage: 7.4 },
                { name: 'Erro Operacional', color: '#ee4d2d', value: 1200, percentage: 13.9 },
                { name: 'On Hold', color: '#0055aa', value: 2951, percentage: 34.2 },
                { name: 'Retirada Fleet', color: '#26aa99', value: 817, percentage: 9.5 },
                { name: 'OFFICE', color: '#757575', value: 3010, percentage: 34.9 },
            ],
            dailyData: [
                { category: 'Amarelo', color: '#f5c518', days: [149, 51, 149, 82, 209, '-', '-'] },
                { category: 'Erro Operacional', color: '#ee4d2d', days: [233, 178, 230, 198, 361, '-', '-'] },
                { category: 'On Hold', color: '#0055aa', days: [502, 252, 61, 37, 2099, '-', '-'] },
                { category: 'Retirada Fleet', color: '#26aa99', days: [272, 109, 87, 162, 187, '-', '-'] },
                { category: 'OFFICE', color: '#757575', days: ['-', '-', '-', '-', 3010, '-', '-'] },
            ],
            dailyTotals: [1156, 590, 527, 479, 5866, 0, 0],
            weekDays: ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'],
        };

        // ── RENDERIZAR DASHBOARD ──
        function renderDashboard() {
            const root = document.getElementById('root');
            
            // Hero Section
            const heroHTML = `
                <div class="hero-section">
                    <div class="container hero-content">
                        <h1>
                            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Shopee_logo.svg/960px-Shopee_logo.svg.png" alt="Shopee Logo">
                            <span>Backlog Carandiru</span>
                        </h1>
                        <p>Relatório de Backlog Semanal • Shopee Brasil</p>
                    </div>
                </div>
            `;

            // Stats Grid
            let statsHTML = '<div class="container"><div class="stats-grid">';
            dashboardData.stats.forEach((stat, idx) => {
                statsHTML += `
                    <div class="shopee-stat-box slide-up" style="animation-delay: ${idx * 100}ms">
                        <div class="stat-label">${stat.label}</div>
                        <div class="stat-value" style="color: ${stat.color || '#ee4d2d'}">${stat.value}</div>
                    </div>
                `;
            });
            statsHTML += '</div>';

            // Main Table
            let tableHTML = `
                <div class="shopee-card">
                    <div class="card-title">
                        <span>Distribuição de Backlog por Dia</span>
                        <span class="shopee-badge">Dados Consolidados</span>
                    </div>
                    <div style="overflow-x: auto;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Categoria</th>
                                    ${dashboardData.weekDays.map(day => `<th style="text-align: center;">${day}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
            `;

            dashboardData.dailyData.forEach(row => {
                tableHTML += `
                    <tr class="shopee-table-row-hover">
                        <td>
                            <div class="category-cell">
                                <div class="dot" style="background: ${row.color}"></div>
                                ${row.category}
                            </div>
                        </td>
                        ${row.days.map(day => `<td style="text-align: center;">${day}</td>`).join('')}
                    </tr>
                `;
            });

            tableHTML += '<tr class="total-row">';
            tableHTML += '<td>TOTAL DIÁRIO</td>';
            dashboardData.dailyTotals.forEach(total => {
                tableHTML += `<td style="text-align: center;">${total}</td>`;
            });
            tableHTML += '</tr></tbody></table></div></div>';

            // Bottom Section
            let progressHTML = `
                <div class="bottom-layout">
                    <div class="shopee-card">
                        <div class="card-title">Volume por Categoria</div>
            `;

            dashboardData.categories.forEach((cat, idx) => {
                progressHTML += `
                    <div class="progress-item slide-up" style="animation-delay: ${idx * 100}ms">
                        <div class="progress-info">
                            <span>${cat.name}</span>
                            <span>${cat.value.toLocaleString()}</span>
                        </div>
                        <div class="shopee-progress-bar">
                            <div class="shopee-progress-fill" style="background: ${cat.color}; width: 0%; animation: fillProgress ${1 + idx * 0.1}s ease-out forwards; animation-delay: 200ms;"></div>
                        </div>
                    </div>
                `;
            });

            progressHTML += `
                    </div>
                    <div class="shopee-card shopee-gradient-orange scale-in" style="animation-delay: 200ms">
                        <div class="big-total-label">Total de Backlog na Semana</div>
                        <div class="big-total-val">8.618</div>
                        <div style="font-size: 14px; opacity: 0.8;">Ocorrências processadas com sucesso</div>
                    </div>
                </div>
            `;

            const footerHTML = `
                <div class="container">
                    <div class="shopee-footer">
                        © 2026 Shopee Seller Centre Dashboard • Gerado para Apresentação Interna
                    </div>
                </div>
            `;

            root.innerHTML = heroHTML + statsHTML + tableHTML + progressHTML + footerHTML;

            // Animar barras de progresso
            setTimeout(() => {
                const fills = document.querySelectorAll('.shopee-progress-fill');
                fills.forEach((fill, idx) => {
                    const percentage = dashboardData.categories[idx].percentage;
                    fill.style.width = percentage + '%';
                });
            }, 250);
        }

        // Adicionar animação de preenchimento
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fillProgress {
                to {
                    width: var(--width);
                }
            }
        `;
        document.head.appendChild(style);

        // Renderizar quando o DOM estiver pronto
        document.addEventListener('DOMContentLoaded', renderDashboard);
    </script>
</body>
</html>
